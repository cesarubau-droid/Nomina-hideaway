<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nómina — Rio Celeste Hideaway</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:    #2d5a3d;
    --verde-claro: #4a8560;
    --celeste:  #7cb9c8;
    --crema:    #f5f0e8;
    --blanco:   #ffffff;
    --gris:     #6b7280;
    --error:    #dc2626;
    --exito:    #16a34a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: var(--blanco);
    border-radius: 16px;
    box-shadow: 0 4px 40px rgba(45,90,61,0.10);
    padding: 3rem 3.5rem;
    width: 100%;
    max-width: 520px;
  }

  .logo {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 600;
    color: var(--verde);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }

  .logo p {
    font-size: 0.85rem;
    color: var(--gris);
    margin-top: 0.3rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .divider {
    width: 48px;
    height: 2px;
    background: var(--celeste);
    margin: 1.2rem auto;
    border-radius: 2px;
  }

  .form-group {
    margin-bottom: 1.4rem;
  }

  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--verde);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  input[type="file"],
  input[type="date"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid #e5e7eb;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: #374151;
    background: var(--crema);
    transition: border-color 0.2s;
    outline: none;
  }

  input[type="file"]:focus,
  input[type="date"]:focus {
    border-color: var(--celeste);
  }

  .dates-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--verde);
    color: var(--blanco);
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  .btn:hover  { background: var(--verde-claro); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }

  .status {
    margin-top: 1.5rem;
    padding: 1rem 1.2rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }

  .status.loading {
    background: #eff6ff;
    color: #1d4ed8;
    display: block;
  }

  .status.success {
    background: #f0fdf4;
    color: var(--exito);
    display: block;
  }

  .status.error {
    background: #fef2f2;
    color: var(--error);
    display: block;
  }

  .download-btn {
    display: inline-block;
    margin-top: 0.8rem;
    padding: 0.6rem 1.2rem;
    background: var(--exito);
    color: var(--blanco);
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .download-btn:hover { opacity: 0.88; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #93c5fd;
    border-top-color: #1d4ed8;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    margin-top: 2rem;
    font-size: 0.78rem;
    color: #9ca3af;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>Rio Celeste Hideaway</h1>
    <p>Sistema de Nómina</p>
    <div class="divider"></div>
  </div>

  <form id="form">
    <div class="form-group">
      <label>Archivo BioTime (.xlsx)</label>
      <input type="file" id="biotime" name="biotime" accept=".xlsx" required>
    </div>

    <div class="dates-row">
      <div class="form-group">
        <label>Fecha Inicio</label>
        <input type="date" id="fecha_inicio" name="fecha_inicio" required>
      </div>
      <div class="form-group">
        <label>Fecha Fin</label>
        <input type="date" id="fecha_fin" name="fecha_fin" required>
      </div>
    </div>

    <button type="submit" class="btn" id="btn">Generar Reporte</button>
  </form>

  <div class="status" id="status"></div>
</div>

<div class="footer">Rio Celeste Hideaway Hotel &nbsp;·&nbsp; RH</div>

<script>
  document.getElementById('form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const btn    = document.getElementById('btn');
    const status = document.getElementById('status');

    // Validar
    const archivo = document.getElementById('biotime').files[0];
    const fi      = document.getElementById('fecha_inicio').value;
    const ff      = document.getElementById('fecha_fin').value;

    if (!archivo || !fi || !ff) {
      status.className = 'status error';
      status.innerHTML = 'Por favor completá todos los campos.';
      return;
    }

    if (fi > ff) {
      status.className = 'status error';
      status.innerHTML = 'La fecha de inicio no puede ser mayor que la fecha fin.';
      return;
    }

    // Loading
    btn.disabled = true;
    btn.textContent = 'Procesando...';
    status.className = 'status loading';
    status.innerHTML = '<span class="spinner"></span> Calculando horas, por favor esperá...';

    const formData = new FormData();
    formData.append('biotime', archivo);
    formData.append('fecha_inicio', fi);
    formData.append('fecha_fin', ff);

    try {
      const resp = await fetch('/generar', { method: 'POST', body: formData });
      const data = await resp.json();

      if (data.success) {
        status.className = 'status success';
        status.innerHTML = `
          ✓ Reporte generado correctamente.<br>
          <small style="color:#374151">${data.registros} registros · ${data.empleados} empleados</small><br>
          <a class="download-btn" href="/descargar/${data.archivo}">⬇ Descargar Excel</a>
        `;
      } else {
        status.className = 'status error';
        status.innerHTML = '✗ Error: ' + data.error;
      }
    } catch (err) {
      status.className = 'status error';
      status.innerHTML = '✗ Error de conexión. Verificá que el servidor esté corriendo.';
    }

    btn.disabled = false;
    btn.textContent = 'Generar Reporte';
  });
</script>

</body>
</html>
